name: Transit demo proxy PostgreSQL
on:
  pull_request:
    paths:
      - 'migrations/20261013_transit_demo_isolated.sql'
      - 'test/fixtures/transit-demo-proxy-assert.sql'
      - '.github/workflows/transit-demo-proxy-postgres.yml'
  workflow_dispatch:
jobs:
  isolated-demo:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: integration_test
          POSTGRES_DB: demo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: integration_test
      PGDATABASE: demo_test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -v ON_ERROR_STOP=1 -f test/fixtures/direction-proxy-postgres-schema.sql
      - run: psql -v ON_ERROR_STOP=1 -f migrations/20261013_dubai_demo_isolated.sql
      - run: psql -v ON_ERROR_STOP=1 -f migrations/20261013_transit_demo_isolated.sql
      - run: psql -v ON_ERROR_STOP=1 -f test/fixtures/transit-demo-proxy-assert.sql
