name: Dubai demo isolated PostgreSQL
on:
  pull_request:
    paths:
      - 'migrations/20261013_dubai_demo_isolated.sql'
      - 'migrations/20261013_dubai_demo_allow_telegram_users.sql'
      - 'test/fixtures/direction-demo-postgres-assert.sql'
      - '.github/workflows/direction-demo-postgres.yml'
  workflow_dispatch:
jobs:
  demo-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: integration_test
          POSTGRES_DB: demo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: integration_test
      PGDATABASE: demo_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create auction user fixture
        run: psql -v ON_ERROR_STOP=1 -f test/fixtures/direction-proxy-postgres-schema.sql
      - name: Apply isolated demo migration
        run: psql -v ON_ERROR_STOP=1 -f migrations/20261013_dubai_demo_isolated.sql
      - name: Assert isolated demo bidding
        run: psql -v ON_ERROR_STOP=1 -f test/fixtures/direction-demo-postgres-assert.sql
      - name: Enable any Telegram-authenticated demo user
        run: psql -v ON_ERROR_STOP=1 -f migrations/20261013_dubai_demo_allow_telegram_users.sql
      - name: Verify pending demo user can bid without affecting real auctions
        run: |
          psql -v ON_ERROR_STOP=1 -c "SELECT public.galaxy_demo_bid('103','manual',100);"
          psql -v ON_ERROR_STOP=1 -c "SELECT public.galaxy_demo_bid('103','manual',100);"
          psql -v ON_ERROR_STOP=1 -c 'DO $ BEGIN IF (SELECT current_bid FROM public.galaxy_demo_lot_state WHERE direction=''dubai'')<>13900 THEN RAISE EXCEPTION ''Repeated demo tap did not increment price''; END IF; END $;'
          psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(*) FROM public.galaxy_auction_bid_events)<>0 THEN RAISE EXCEPTION 'Real bids changed'; END IF; END \$\$;"
