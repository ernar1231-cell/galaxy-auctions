name: Direction SOLD PostgreSQL integration
on:
  pull_request:
    paths:
      - 'migrations/20261012_direction_sold_next.sql'
      - 'test/fixtures/direction-sold-*.sql'
      - '.github/workflows/direction-sold-postgres.yml'
  workflow_dispatch:
jobs:
  sold:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: integration_test
          POSTGRES_DB: sold_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: integration_test
      PGDATABASE: sold_test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -v ON_ERROR_STOP=1 -f test/fixtures/direction-sold-schema.sql
      - run: psql -v ON_ERROR_STOP=1 -f migrations/20261012_direction_sold_next.sql
      - run: psql -v ON_ERROR_STOP=1 -f test/fixtures/direction-sold-assert.sql
