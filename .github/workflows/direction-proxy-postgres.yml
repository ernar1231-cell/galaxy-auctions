name: Direction proxy PostgreSQL integration
on:
  pull_request:
    paths:
      - 'migrations/20261012_direction_atomic_proxy_draft.sql'
      - 'test/fixtures/direction-proxy-postgres-*.sql'
      - '.github/workflows/direction-proxy-postgres.yml'
  workflow_dispatch:
jobs:
  proxy-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: integration_test
          POSTGRES_DB: proxy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: integration_test
      PGDATABASE: proxy_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated fixture
        run: psql -v ON_ERROR_STOP=1 -f test/fixtures/direction-proxy-postgres-schema.sql
      - name: Apply draft SQL to isolated database
        run: psql -v ON_ERROR_STOP=1 -f migrations/20261012_direction_atomic_proxy_draft.sql
      - name: Exercise proxy bid transaction scenarios
        run: psql -v ON_ERROR_STOP=1 -f test/fixtures/direction-proxy-postgres-assert.sql
      - name: Exercise rejected proxy offers without writes
        run: psql -v ON_ERROR_STOP=1 -f test/fixtures/direction-proxy-postgres-negative.sql
      - name: Assert lock wait does not permit expired bid
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "UPDATE public.galaxy_auction_sessions SET phase_started_at=clock_timestamp()-interval '13 seconds' WHERE direction='transfer';"
          (psql -v ON_ERROR_STOP=1 -c "BEGIN; SELECT 1 FROM public.galaxy_auction_sessions WHERE direction='transfer' FOR UPDATE; SELECT pg_sleep(4); COMMIT;" > /tmp/locker.log 2>&1) &
          locker=$!
          sleep 1
          if psql -v ON_ERROR_STOP=1 -c "SELECT * FROM public.galaxy_direction_submit_bid('transfer',70,'101','manual',100);" > /tmp/bid.log 2>&1; then
            echo "Expired bid was accepted while waiting for row lock"; cat /tmp/bid.log; exit 1
          fi
          wait "$locker"
          grep -q 'Auction not accepting bids' /tmp/bid.log
