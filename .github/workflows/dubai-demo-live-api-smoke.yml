name: Dual demo production API smoke
on:
  pull_request:
    paths:
      - '.github/workflows/dubai-demo-live-api-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-demo-get:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify both public demo directions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request
          for direction, lot, minimum in [('dubai',69,12500),('transfer',70,9500)]:
              url='https://galaxyauction.live/api/direction-demo-bid?direction='+direction
              request=urllib.request.Request(url,headers={'Accept':'application/json','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=20) as response:
                  assert response.status==200, response.status
                  assert 'application/json' in response.headers.get('Content-Type','')
                  data=json.load(response)
              assert data.get('demo') is True,data
              assert data.get('direction')==direction,data
              assert data.get('lotNumber')==lot,data
              assert float(data.get('currentBid'))>=minimum,data
              print('PASS',direction,lot,'test price',data['currentBid'])
          PY
